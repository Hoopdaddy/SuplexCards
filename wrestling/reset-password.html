<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Suplex Trading Cards</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-wrap {
      min-height: calc(100vh - 64px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 3rem 1rem;
      background: linear-gradient(135deg, #0d1117 0%, #12161f 100%);
    }
    .auth-card {
      background: var(--mid); border: 1px solid var(--border);
      border-radius: 10px; padding: 2rem 2rem 2.5rem;
      width: 100%; max-width: 400px;
    }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo h2 { font-size: 1.4rem; color: var(--gold); margin: 0; }
    .auth-logo p  { color: var(--muted); font-size: 0.82rem; margin: 0.3rem 0 0; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
    .form-group input {
      width: 100%; box-sizing: border-box;
      background: var(--darker); border: 1px solid var(--border);
      color: var(--text); border-radius: 5px;
      padding: 0.6rem 0.8rem; font-size: 0.88rem;
    }
    .form-group input:focus { outline: none; border-color: var(--gold); }

    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 0.7rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 0;
    }

    .btn-submit {
      width: 100%; padding: 0.7rem; background: var(--red);
      color: #fff; border: none; border-radius: 5px;
      font-size: 0.9rem; font-weight: 800; cursor: pointer;
      margin-top: 0.5rem; transition: background 0.15s;
    }
    .btn-submit:hover:not(:disabled) { background: #c0392b; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-error {
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      color: #f87171; border-radius: 5px; padding: 0.6rem 0.8rem;
      font-size: 0.82rem; margin-bottom: 1rem; display: none;
    }
    .auth-success {
      background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3);
      color: #34d399; border-radius: 5px; padding: 1.2rem 1rem;
      font-size: 0.9rem; text-align: center; display: none;
    }
    .auth-success strong { display: block; font-size: 1.1rem; margin-bottom: 0.4rem; }
  </style>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="img/logo.png" alt="Suplex Trading Cards" class="nav-logo-img">
      <span class="nav-logo-text">Suplex <span class="nav-logo-accent">Trading</span> Cards</span>
    </a>
    <ul class="nav-links">
      <li><a href="search.html">Search</a></li>
      <li><a href="checklist.html">My Checklist</a></li>
    </ul>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <h2>Set New Password</h2>
      <p>Choose a strong password for your account</p>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <div class="auth-success" id="auth-success">
      <strong>Password updated! ✅</strong>
      You can now sign in with your new password.
      <br><br>
      <a href="login.html" style="color:#34d399;font-weight:700">Go to Sign In →</a>
    </div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="password">New Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" data-target="password">Show</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat password" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" data-target="confirm-password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Update Password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(async function () {
  // Establish session from the reset link tokens in the URL hash
  const hash   = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token  = params.get('access_token');
  const refresh = params.get('refresh_token') || '';

  const errEl = document.getElementById('auth-error');

  if (token) {
    const { error } = await sb.auth.setSession({ access_token: token, refresh_token: refresh });
    if (error) {
      errEl.textContent = 'Reset link has expired or is invalid. Please request a new one.';
      errEl.style.display = 'block';
      document.getElementById('reset-form').style.display = 'none';
    }
  }

  // Password visibility toggles
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = document.getElementById(btn.dataset.target);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
    });
  });

  // Form submit
  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const pw  = document.getElementById('password').value;
    const pw2 = document.getElementById('confirm-password').value;
    errEl.style.display = 'none';

    if (pw.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.style.display = 'block';
      return;
    }
    if (pw !== pw2) {
      errEl.textContent = 'Passwords do not match.';
      errEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Updating…';

    const { error } = await SB_AUTH.updatePassword(pw);

    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Update Password';
    } else {
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('auth-success').style.display = 'block';
      await sb.auth.signOut();
    }
  });
})();
</script>
</body>
</html>
