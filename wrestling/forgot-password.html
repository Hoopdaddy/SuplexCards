<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Suplex Trading Cards</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-wrap {
      min-height: calc(100vh - 64px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 3rem 1rem;
      background: linear-gradient(135deg, #0d1117 0%, #12161f 100%);
    }
    .auth-card {
      background: var(--mid); border: 1px solid var(--border);
      border-radius: 10px; padding: 2rem 2rem 2.5rem;
      width: 100%; max-width: 400px;
    }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo h2 { font-size: 1.4rem; color: var(--gold); margin: 0; }
    .auth-logo p  { color: var(--muted); font-size: 0.82rem; margin: 0.3rem 0 0; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
    .form-group input {
      width: 100%; box-sizing: border-box;
      background: var(--darker); border: 1px solid var(--border);
      color: var(--text); border-radius: 5px;
      padding: 0.6rem 0.8rem; font-size: 0.88rem;
    }
    .form-group input:focus { outline: none; border-color: var(--gold); }

    .btn-submit {
      width: 100%; padding: 0.7rem; background: var(--red);
      color: #fff; border: none; border-radius: 5px;
      font-size: 0.9rem; font-weight: 800; cursor: pointer;
      margin-top: 0.5rem; transition: background 0.15s;
    }
    .btn-submit:hover:not(:disabled) { background: #c0392b; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-error {
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      color: #f87171; border-radius: 5px; padding: 0.6rem 0.8rem;
      font-size: 0.82rem; margin-bottom: 1rem; display: none;
    }
    .auth-success {
      background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3);
      color: #34d399; border-radius: 5px; padding: 1.2rem 1rem;
      font-size: 0.9rem; text-align: center; display: none;
    }
    .auth-success strong { display: block; font-size: 1.1rem; margin-bottom: 0.4rem; }

    .auth-footer { text-align: center; margin-top: 1.2rem; font-size: 0.82rem; color: var(--muted); }
    .auth-footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="img/logo.png" alt="Suplex Trading Cards" class="nav-logo-img">
      <span class="nav-logo-text">Suplex <span class="nav-logo-accent">Trading</span> Cards</span>
    </a>
    <ul class="nav-links">
      <li><a href="search.html">Search</a></li>
      <li><a href="checklist.html">My Checklist</a></li>
      <li><a href="login.html">Sign In</a></li>
    </ul>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <h2>Forgot Password?</h2>
      <p>Enter your email and we'll send a reset link</p>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <div class="auth-success" id="auth-success">
      <strong>Reset link sent! 📬</strong>
      Check your inbox at <span id="sent-email"></span> and click the link to set a new password.
    </div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">← Back to sign in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errEl.textContent = 'Please enter a valid email address.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  const { error } = await SB_AUTH.resetPasswordEmail(email);

  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
  } else {
    document.getElementById('forgot-form').style.display = 'none';
    document.getElementById('sent-email').textContent = email;
    document.getElementById('auth-success').style.display = 'block';
  }
});
</script>
</body>
</html>
